<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Evidencias</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1a365d;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .section-block {
            background-color: white;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .section-block h2 {
            color: #2b6cb0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .links-list {
            list-style: none;
        }

        .links-list li {
            margin-bottom: 0.75rem;
        }

        .links-list a {
            display: inline-block;
            text-decoration: none;
            color: #2b6cb0;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 300px;
        }

        .links-list a:hover {
            background-color: #2b6cb0;
            color: white;
            border-color: #2b6cb0;
        }

        footer {
            background-color: #2d3748;
            color: #e2e8f0;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-top: auto;
        }

        footer p {
            margin: 0.25rem 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portafolio de Evidencias</h1>
        <p>Construye e Implementa Aplicaciones Web</p>
    </header>

    <main>
        <!-- Bloque 1: Construye -->
        <section class="section-block">
            <h2>Construye</h2>
            <ul class="links-list">
                <li><a href="practica1.html" target="_blank">Práctica 1</a></li>
                <li><a href="imagen.html" target="_blank">Imagen</a></li>
                <li><a href="practica2.html" target="_blank">Práctica 2</a></li>
                <li><a href="ejemplo3.html" target="_blank">Ejemplo 3</a></li>
                <li><a href="blabla4.html" target="_blank">Blabla 4</a></li>
            </ul>
        </section>

        <!-- Bloque 2: Implementa -->
        <section class="section-block">
            <h2>Implementa</h2>
            <ul class="links-list">
                <!-- Agrega aquí los enlaces correspondientes al módulo Implementa -->
                <li><a href="#" target="_blank">Próximamente...</a></li>
            </ul>
        </section>
    </main>

    <footer>
        <p><strong>Nombre Completo:</strong> [Tu Nombre Aquí]</p>
        <p><strong>Grupo:</strong> [Tu Grupo Aquí]</p>
    </footer>

</body>
</html>
